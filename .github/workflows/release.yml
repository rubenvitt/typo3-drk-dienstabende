# Pushing a tag like v0.2.0 creates a GitHub release with the ZIP for the TYPO3 Extension Manager.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version in ext_emconf.php must match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "'version' => '$VERSION'" ext_emconf.php || { echo "ext_emconf.php has not version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Mapper self-check
        run: php Tests/EventMapperCheck.php

      - name: Build ZIP (files marked export-ignore in .gitattributes are left out)
        run: git archive --format=zip -o "drk_dienstabende_$VERSION.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "drk_dienstabende_$VERSION.zip" --title "$GITHUB_REF_NAME" --generate-notes
